<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro-Pay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0F0A1E;
  --panel: #1A1035;
  --panel2: #231548;
  --border: #3A2468;
  --accent: #7C4DFF;
  --accent-glow: rgba(124,77,255,0.3);
  --green: #2ECC71;
  --green-dark: #27ae60;
  --green-glow: rgba(46,204,113,0.3);
  --ink: #F0EAFF;
  --ink-dim: #9A82CC;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Manrope', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(500px 350px at 15% 0%, rgba(124,77,255,0.14), transparent 60%),
    radial-gradient(350px 350px at 85% 85%, rgba(46,204,113,0.07), transparent 55%);
  pointer-events: none;
}
.card {
  position: relative;
  width: 100%;
  max-width: 400px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 30px 26px 26px;
  box-shadow: 0 0 0 1px rgba(124,77,255,0.08), 0 20px 60px rgba(0,0,0,0.55);
}

/* Brand */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.brand-logo {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  background: linear-gradient(135deg, #7C4DFF, #C850C0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}
.brand-name {
  font-family: 'Unbounded', sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

/* Amount label + input */
.field-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-dim);
  font-weight: 700;
  margin-bottom: 10px;
}
.input-wrap {
  position: relative;
  margin-bottom: 14px;
}
.amount-input {
  width: 100%;
  background: var(--panel2);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 16px 52px 16px 20px;
  font-family: 'Unbounded', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}
.amount-input::-webkit-outer-spin-button,
.amount-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.amount-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.amount-input::placeholder { color: #3A2468; }
.input-suffix {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Unbounded', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink-dim);
  pointer-events: none;
}

/* Quick chips */
.chips {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 26px;
}
.chip {
  padding: 7px 13px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  background: var(--panel2);
  color: var(--ink-dim);
  font-family: 'Manrope', sans-serif;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-variant-numeric: tabular-nums;
  user-select: none;
}
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip.active { border-color: var(--accent); background: rgba(124,77,255,0.15); color: var(--ink); }

/* Pay button */
.pay-btn {
  width: 100%;
  padding: 16px;
  border-radius: 13px;
  border: none;
  background: var(--green);
  color: #fff;
  font-family: 'Manrope', sans-serif;
  font-size: 15.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 20px var(--green-glow);
  margin-bottom: 16px;
  letter-spacing: 0.01em;
}
.pay-btn:hover:not(:disabled) {
  background: var(--green-dark);
  box-shadow: 0 6px 28px rgba(46,204,113,0.4);
  transform: translateY(-1px);
}
.pay-btn:active:not(:disabled) { transform: translateY(0); }
.pay-btn:disabled {
  background: var(--panel2);
  color: var(--ink-dim);
  box-shadow: none;
  cursor: not-allowed;
}
.pay-btn .spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Payment methods */
.methods {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 18px;
}
.method-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px;
  border-radius: 8px;
  background: var(--panel2);
  border: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-dim);
}
.method-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

/* Security */
.security {
  text-align: center;
  font-size: 11px;
  color: var(--ink-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

/* Error */
.error-msg {
  background: rgba(255,83,112,0.1);
  border: 1px solid rgba(255,83,112,0.25);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  color: #ff8fa3;
  margin-bottom: 16px;
  display: none;
  line-height: 1.4;
}
</style>
</head>
<body>

<div class="card">

  <div class="brand">
    <div class="brand-logo">🌙</div>
    <div>
      <div class="brand-name">Astro-Pay</div>
    </div>
  </div>

  <div class="field-label">Введи сумму</div>

  <div class="input-wrap">
    <input type="number" class="amount-input" id="amount-input"
           placeholder="0" min="100" max="500000" inputmode="numeric">
    <span class="input-suffix">₽</span>
  </div>

  <div class="chips">
    <div class="chip" data-val="1900"  onclick="setChip(this)">1 900 ₽</div>
    <div class="chip" data-val="3900"  onclick="setChip(this)">3 900 ₽</div>
    <div class="chip" data-val="10000" onclick="setChip(this)">10 000 ₽</div>
    <div class="chip" data-val="15000" onclick="setChip(this)">15 000 ₽</div>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <button class="pay-btn" id="pay-btn" disabled onclick="handlePay()">
    Перейти к оплате →
  </button>

  <div class="methods">
    <div class="method-badge"><span class="method-dot"></span>СБП</div>
    <div class="method-badge"><span class="method-dot"></span>Карта</div>
    <div class="method-badge"><span class="method-dot"></span>QR</div>
  </div>

  <div class="security">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
      <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    Защищённая оплата
  </div>

</div>

<script>
const input = document.getElementById('amount-input');
const btn   = document.getElementById('pay-btn');
const errEl = document.getElementById('error-msg');

// Prefill from URL: ?amount=3900
const urlAmount = new URLSearchParams(window.location.search).get('amount');
if (urlAmount && /^\d+$/.test(urlAmount)) {
  input.value = urlAmount;
  updateBtn();
  document.querySelectorAll('.chip').forEach(c => {
    if (c.dataset.val === urlAmount) c.classList.add('active');
  });
}

input.addEventListener('input', updateBtn);

function updateBtn() {
  const v = parseInt(input.value);
  btn.disabled = !(v >= 100 && v <= 500000);
}

function setChip(el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  input.value = el.dataset.val;
  updateBtn();
}

async function handlePay() {
  const amount = parseInt(input.value);
  if (!amount || amount < 100) { showError('Введи сумму от 100 ₽'); return; }

  errEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Создаём ссылку...';

  try {
    // Вызываем нашу Netlify Function (прокси) — не RollyPay напрямую
    const resp = await fetch('/.netlify/functions/pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: amount }),
    });

    const data = await resp.json();

    if (!resp.ok) {
      throw new Error(data.message || data.error || ('Ошибка сервера ' + resp.status));
    }

    const payUrl = data.pay_url;
    if (!payUrl) throw new Error('Платёжная ссылка не получена');

    window.location.href = payUrl;

  } catch (e) {
    showError(e.message || 'Ошибка соединения. Попробуй ещё раз.');
    btn.disabled = false;
    btn.textContent = 'Перейти к оплате →';
  }
}

function showError(msg) {
  errEl.textContent = '⚠️ ' + msg;
  errEl.style.display = 'block';
}
</script>

</body>
</html>
